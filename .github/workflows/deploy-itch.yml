name: Release

env:
  itchio_project: casmo/spaceshooter-3
  itchio_channel: windows

on:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  exports:
    name: Build, Release, and Upload
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Zip build
        run: cd dist && zip -r ../build.zip .
      - name: Set Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
          else
            echo "version=${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi
      - name: Upload ${{ matrix.preset }} to itch.io project
        uses: robpc/itchio-upload-action@v1
        with:
          path: build.zip
          project: ${{ env.itchio_project }}
          channel: ${{ env.itchio_channel }}
          version: ${{ env.version }}
          api-key: ${{ secrets.ITCHIO_API_KEY }}